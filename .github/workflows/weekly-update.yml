name: Weekly data update

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, after weekend matches
  workflow_dispatch:       # adds a "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_external.py
      # Add your processing steps here as you build them, e.g.:
      # - run: python scripts/build_results.py
      - name: Commit processed data if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/processed
          git diff --cached --quiet || git commit -m "data: weekly update"
          git push
